<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <radialGradient id="glow-cyan-light" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple-light" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badge-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.06" />
    </linearGradient>

    <pattern id="dot-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad-light)" />
  <rect width="1200" height="380" rx="16" fill="url(#dot-grid-light)" />
  <rect width="1200" height="380" rx="16" fill="url(#glow-cyan-light)" />
  <rect width="1200" height="380" rx="16" fill="url(#glow-purple-light)" />

  <!-- Outer Hairline Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="15.25" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- LEFT COLUMN: Identity & Bio -->
  <g transform="translate(60, 48)">
    <!-- Pill Badge -->
    <rect width="242" height="28" rx="14" fill="url(#badge-grad-light)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="14" cy="14" r="4" fill="#059669" />
    <text x="26" y="18.5" class="font-sans" font-size="11.5" font-weight="600" fill="#0369a1" letter-spacing="1.2">SYSTEMS &amp; DESKTOP TOOLS</text>

    <!-- Name Heading -->
    <text x="0" y="85" class="font-sans" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.8">Sankalpa K M C P</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="122" class="font-sans" font-size="18" font-weight="500" fill="#334155">
      Native Desktop Utilities · Systems Engineering · Full-Stack Development
    </text>

    <text x="0" y="152" class="font-sans" font-size="14" font-weight="400" fill="#64748b">
      Focused on native performance, secure local persistence, and clean UX.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: Tauri + Rust -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text x="52.5" y="17" class="font-mono" font-size="11" font-weight="500" fill="#0284c7" text-anchor="middle">Rust · Tauri v2</text>
      </g>
      <!-- Pill 2: React 19 + TypeScript -->
      <g transform="translate(115, 0)">
        <rect width="145" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text x="72.5" y="17" class="font-mono" font-size="11" font-weight="500" fill="#4f46e5" text-anchor="middle">React 19 · TypeScript</text>
      </g>
      <!-- Pill 3: Spring Boot + PostgreSQL -->
      <g transform="translate(270, 0)">
        <rect width="125" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text x="62.5" y="17" class="font-mono" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">Spring Boot 3</text>
      </g>
      <!-- Pill 4: Local-First / SQLite -->
      <g transform="translate(405, 0)">
        <rect width="135" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text x="67.5" y="17" class="font-mono" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">SQLCipher / SQLite</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="#e2e8f0" stroke-width="1" />
      <text x="0" y="24" class="font-mono" font-size="12" fill="#64748b">
        SLIIT IT Undergraduate · Based in Sri Lanka · Open Source Author
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Elegant Code Terminal -->
  <g transform="translate(670, 40)">
    <!-- Terminal Window Container -->
    <rect width="470" height="300" rx="10" fill="#ffffff" stroke="url(#card-border-light)" stroke-width="1.5" />

    <!-- Terminal Titlebar -->
    <rect width="470" height="36" rx="10" fill="#f8fafc" />
    <circle cx="20" cy="18" r="5" fill="#f87171" fill-opacity="0.9" />
    <circle cx="36" cy="18" r="5" fill="#fbbf24" fill-opacity="0.9" />
    <circle cx="52" cy="18" r="5" fill="#34d399" fill-opacity="0.9" />
    <text x="235" y="23" class="font-mono" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">sankalpa.config.ts</text>

    <!-- Code Content -->
    <g transform="translate(24, 66)" class="font-mono" font-size="12.5" xml:space="preserve">
      <!-- Line 1 -->
      <text y="0"><tspan fill="#e11d48">export const</tspan> <tspan fill="#0284c7">developer</tspan> <tspan fill="#475569">=</tspan> <tspan fill="#0f172a">{</tspan></text>
      <!-- Line 2 -->
      <text y="24" x="16"><tspan fill="#475569">name:</tspan> <tspan fill="#4f46e5">"Sankalpa K M C P"</tspan><tspan fill="#475569">,</tspan></text>
      <!-- Line 3 -->
      <text y="48" x="16"><tspan fill="#475569">coreStack:</tspan> <tspan fill="#0f172a">[</tspan></text>
      <!-- Line 4 -->
      <text y="72" x="32"><tspan fill="#4f46e5">"Tauri v2"</tspan><tspan fill="#475569">,</tspan> <tspan fill="#4f46e5">"Rust"</tspan><tspan fill="#475569">,</tspan> <tspan fill="#4f46e5">"React 19"</tspan><tspan fill="#475569">,</tspan> <tspan fill="#4f46e5">"TypeScript"</tspan></text>
      <!-- Line 5 -->
      <text y="96" x="16"><tspan fill="#0f172a">]</tspan><tspan fill="#475569">,</tspan></text>
      <!-- Line 6 -->
      <text y="120" x="16"><tspan fill="#475569">focus:</tspan> <tspan fill="#4f46e5">"Desktop Utilities &amp; Systems"</tspan><tspan fill="#475569">,</tspan></text>
      <!-- Line 7 -->
      <text y="144" x="16"><tspan fill="#475569">latestRelease:</tspan> <tspan fill="#059669">"PortPurge v0.6.0"</tspan><tspan fill="#475569">,</tspan></text>
      <!-- Line 8 -->
      <text y="168" x="16"><tspan fill="#475569">status:</tspan> <tspan fill="#0284c7">"Shipping production software"</tspan></text>
      <!-- Line 9 -->
      <text y="194"><tspan fill="#0f172a">};</tspan></text>
    </g>

    <!-- Terminal Footer Status Bar -->
    <rect y="272" width="470" height="28" rx="0" fill="#f8fafc" />
    <circle cx="20" cy="286" r="3" fill="#059669" />
    <text x="32" y="290" class="font-mono" font-size="10.5" fill="#64748b">UTF-8</text>
    <text x="80" y="290" class="font-mono" font-size="10.5" fill="#64748b">TypeScript</text>
    <text x="445" y="290" class="font-mono" font-size="10.5" fill="#059669" text-anchor="end">Production Ready</text>
  </g>
</svg>