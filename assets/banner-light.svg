  <text x="68" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="500" fill="#4F6379">Thoughtful software, built to be useful.</text>
  <path d="M 68 255 H 390" stroke="url(#wave)" stroke-width="4" stroke-linecap="round"/>
  <text x="68" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#4F6379">Software developer  /  curious builder</text>
