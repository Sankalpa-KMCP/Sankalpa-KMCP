<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Sankalpa K M C P — thoughtful software, built to be useful</title>
  <desc id="desc">Dark or light abstract engineering dashboard with Sankalpa’s name and selected areas of work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#101D31"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#64E7CF" stop-opacity="0.20"/><stop offset="1" stop-color="#64E7CF" stop-opacity="0"/></radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64E7CF"/><stop offset="1" stop-color="#7C95FF"/></linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#92BCD6" opacity=".21"/></pattern>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="21" flood-color="#000" flood-opacity=".21"/></filter>
  </defs>
