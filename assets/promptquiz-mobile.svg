 <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#7AE3D0"/><stop offset=".5" stop-color="#8DB9FF"/><stop offset="1" stop-color="#C0ADFF"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#30455F" stroke-opacity=".16"/></pattern>
</defs>
<rect x="0" y="0" width="320" height="350" rx="16" fill="url(#base)"/><path d="M20 24H40" fill="none" stroke="#C0ADFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="81" font-size="40" font-weight="650" fill="#F2F6FF" font-family="'Segoe UI',Arial,sans-serif" letter-spacing="-1">PromptQuiz</text><rect x="45" y="115" width="255" height="207" rx="14" fill="#17283E" stroke="#30455F" stroke-width="1"/><rect x="32" y="130" width="255" height="207" rx="14" fill="#101D30" stroke="#30455F" stroke-width="1"/><rect x="20" y="145" width="255" height="192" rx="14" fill="#101D30" stroke="#30455F" stroke-width="1"/><text x="40" y="194" font-size="35" font-weight="600" fill="#F2F6FF" font-family="'Segoe UI',Arial,sans-serif">Recall.</text><text x="40" y="236" font-size="35" font-weight="600" fill="#F2F6FF" font-family="'Segoe UI',Arial,sans-serif">Review.</text><text x="40" y="278" font-size="35" font-weight="600" fill="#F2F6FF" font-family="'Segoe UI',Arial,sans-serif">Repeat.</text><path d="M209 200q39-13 39 24v29 M238 243l10 10 10-10" fill="none" stroke="#C0ADFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="229" cy="297" r="7" fill="#7AE3D0"/><circle cx="253" cy="297" r="7" fill="#8DB9FF"/><rect x="0.75" y="0.75" width="318.5" height="348.5" rx="16" fill="none" stroke="#30455F" stroke-width="1.5"/>
