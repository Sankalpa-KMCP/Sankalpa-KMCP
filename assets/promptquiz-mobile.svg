<svg xmlns="http://www.w3.org/2000/svg" width="320" height="350" viewBox="0 0 320 350" role="img" aria-labelledby="title desc">
<title id="title">PromptQuiz</title><desc id="desc">A conceptual stack of recall cards connected to a recall, rate and review cycle. Simplified for narrow screens.</desc>
